<article class="container border border-1 p-2 rounded-4">
  <div class="row g-3">
    <p>Pesquise por filtro</p>
    <div class="col-12 col-md-6 col-lg-6">
      <label for="" class="form-label">Tipo pessoa</label>
      <select class="form-select" name="tipoPessoa" [(ngModel)]="tipoPessoa" id="tipoPessoa">
        <option value="2">Aluno</option>
        <option value="3">Professor</option>
      </select>
    </div>
    <div class="col-12 col-md-6 col-lg-6">
      <label for="" class="form-label">Status</label>
        <select class="form-select" name="status" [(ngModel)]="status" id="status">
            <option value="1">Todos</option>
            <option value="2">Ativo</option>
            <option value="3">Inativo</option>
        </select>
      </div>
  </div>
</article>
